<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todos</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --border: #e3e3e8;
      --text: #1f2328;
      --muted: #6b7280;
      --accent: #2563eb;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 32rem;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.75rem; }
    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--card);
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    li.done .title {
      text-decoration: line-through;
      color: var(--muted);
    }
    .title { flex: 1; }
    .delete {
      background: transparent;
      color: var(--danger);
      font-size: 1.25rem;
      padding: 0 0.25rem;
    }
    .empty {
      padding: 1rem;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Todos</h1>
    <form id="add-form">
      <input id="title" type="text" placeholder="What needs to be done?" required />
      <input id="due_date" type="date" />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
  </main>

  <script>
    const list = document.getElementById("todo-list");
    const form = document.getElementById("add-form");
    const input = document.getElementById("title");
    const dueDateInput = document.getElementById("due_date");

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.status === 204 ? null : res.json();
    }

    // TODO: show a friendly error toast instead of just throwing when the API call fails
    async function refresh() {
      const todos = await api("/todos");
      list.innerHTML = "";
      if (todos.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No todos yet.";
        list.appendChild(li);
        return;
      }
      for (const todo of todos) {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", async () => {
          await api(`/todos/${todo.id}`, {
            method: "PATCH",
            body: JSON.stringify({ done: checkbox.checked }),
          });
          refresh();
        });

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = todo.title;

        if (todo.due_date) {
          const due = document.createElement("small");
          due.style.color = "var(--muted)";
          due.style.fontSize = "0.85em";
          due.textContent = `Due: ${todo.due_date}`;
          title.append(" ", due);
        }

        const del = document.createElement("button");
        del.className = "delete";
        del.title = "Delete";
        del.textContent = "×";
        del.addEventListener("click", async () => {
          await api(`/todos/${todo.id}`, { method: "DELETE" });
          refresh();
        });

        li.append(checkbox, title, del);
        list.appendChild(li);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      const dueDate = dueDateInput.value || null;
      await api("/todos", {
        method: "POST",
        body: JSON.stringify({ title, due_date: dueDate }),
      });
      input.value = "";
      dueDateInput.value = "";
      refresh();
    });

    refresh();
  </script>
</body>
</html>
